name: NeuroMarket Mobile CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mobile foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python for native icon verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated launcher icons against approved WebP
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/generate_launcher_icons.py --check

      - name: Validate Expo dependency compatibility
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Verify NeuroMarket public identity and support
        run: npm run check:product-identity

      - name: Verify LA Z public contact and sales destinations
        run: npm run check:contact-v1

      - name: Export web smoke build
        run: npx expo export --platform web --output-dir dist-ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
